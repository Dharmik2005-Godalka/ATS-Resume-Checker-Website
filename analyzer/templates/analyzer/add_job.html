{% extends 'base.html' %}

{% block title %}Post a Job{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 700px;">
    <h3 class="mb-3">Post a New Job</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Post Job</button>
    </form>
    <a href="{% url 'faculty_dashboard' %}" class="btn btn-link mt-2">Back to dashboard</a>
</div>
{% endblock %}
