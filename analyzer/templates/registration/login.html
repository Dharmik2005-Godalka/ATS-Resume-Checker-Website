{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h3 class="mb-3">Login</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
