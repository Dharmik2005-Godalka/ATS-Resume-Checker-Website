{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h3 class="mb-3">Create Account</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
